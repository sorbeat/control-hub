<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control Hub</title>
    <link rel="stylesheet" href="css/base.css">

</head>
<body>
    <header class = "app-header">
        <h1>Control Hub</h1>
    </header>

    <main class = "dashboard"></main>
        <section class = "site-grid">
            <!-- Note CSS Naming Conventions, BEM (single dash) is component and (double dash) is element -->
            <article class = "site-card">
                <img class="site-card__thumbnail" src="https://via.placeholder.com/400x225" alt="Thumbnail of example site">
                <div class = "site__body">
                    <h2 class = "site-card__name">SeagullView</h2>
                    <p class =" site-card__url">https://example.com</p>
                    <span class = "site-card__status site-card__status--online">Online</span>
                    <p class = "site-card__meta">Visitors Today: 128</p>
                    <p class = "site-card__meta">Last deployed: 2 hours ago.</p>
                </div>
            </article>
        </section>
    </main>





</body>
